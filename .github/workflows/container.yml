name: Container image

on:
  push:
    branches: [main]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke test and publish to GHCR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Go version from go.mod
        id: go
        run: echo "version=$(awk '$1 == "go" { print $2 }' go.mod)" >> "$GITHUB_OUTPUT"

      # Only the final alpine stage runs under emulation; the Go build cross-compiles natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          platforms: linux/arm64
          load: true
          tags: mcp-server-stripe-org:test
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

      - name: Smoke test without Stripe credentials
        shell: bash
        run: |
          container=$(docker run --detach \
            --env MCP_TOKEN=container-smoke-test \
            --publish 127.0.0.1::8080 mcp-server-stripe-org:test)
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          address=$(docker port "$container" 8080/tcp)
          test "$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 2 "http://$address/health")" = ok
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --request POST --write-out '%{http_code}' "http://$address/mcp")" = 401

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
