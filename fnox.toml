[providers.1password]
type = "1password"

# Sandbox credentials for local dev and Workers Previews. STRIPE_ACCOUNTS comes from accounts.sandbox.json.
[secrets]
STRIPE_ORG_KEY = { provider = "1password", value = "op://cloud-dev/Stripe - digital-vibes-org - Cloudflare Stripe proxy sandbox/credential" }
CLOUDFLARE_API_TOKEN = { provider = "1password", value = "op://cloud-dev/Cloudflare - mcp-server-stripe-org - worker deploy token/credential" }
MCP_TOKEN = { provider = "1password", value = "op://cloud-dev/mcp-server-stripe-org-preview/password" }

# Live credentials for the production worker. STRIPE_ACCOUNTS comes from accounts.json.
[profiles.production.secrets]
STRIPE_ORG_KEY = { provider = "1password", value = "op://Dev/Stripe - digital-vibes-org - Cloudflare Stripe proxy/credential" }
MCP_TOKEN = { provider = "1password", value = "op://Dev/mcp-server-stripe-org-prod/password" }
