[tools]
go = "1.26.3"
wrangler = "4.156.1"
jq = "1.8.1"

# CLOUDFLARE_ACCOUNT_ID comes from fnox.cloud.toml (cloud profile) in cloud sessions
# and from the gitignored mise.local.toml on local machines.

[tasks.build-worker]
description = "Build the Cloudflare Workers bundle into build/"
run = """
go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=go
GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o ./build/app.wasm ./cmd/mcp-worker
"""

[tasks.gen-index]
description = "Regenerate stripe/index.json.gz from the pinned Stripe OpenAPI spec"
run = "go run ./cmd/gen-index"

[tasks.dev-vars]
description = "Write the gitignored .dev.vars for wrangler dev from the active fnox profile"
run = '''
set -eu
vars="$(env -u STRIPE_ORG_KEY -u STRIPE_ACCOUNTS -u MCP_TOKEN fnox exec -- jq -nr '
  $ENV | {STRIPE_ORG_KEY, STRIPE_ACCOUNTS, MCP_TOKEN}
  | if any(.[]; . == null or . == "") then error("empty in the fnox profile: \([to_entries[] | select(.value == null or .value == "") | .key] | join(", "))") else . end
  | .STRIPE_ACCOUNTS |= (fromjson | tojson)
  | to_entries[]
  | if .value | test("[\n'\'']") then error("\(.key) contains a newline or single quote")
    else "\(.key)='\''\(.value)'\''" end
')"
rm -f .dev.vars
umask 077
printf '%s\n' "$vars" > .dev.vars
'''

[tasks.dev]
description = "Run the worker locally with wrangler using secrets from the active fnox profile"
depends = ["dev-vars"]
run = "wrangler dev"

[tasks.deploy]
description = "Build and deploy the worker"
run = "fnox -P production exec -- wrangler deploy"

[tasks.worker-secrets]
description = "Upload STRIPE_ORG_KEY, STRIPE_ACCOUNTS and MCP_TOKEN to the worker from a fnox profile"
usage = 'flag "-P --profile <profile>" help="fnox profile to read the secrets from (default: the active profile)"'
run = '''
set -eu
profile="${usage_profile:-}"
# Validate all three secrets first so a missing one aborts before any upload.
secrets="$(env -u STRIPE_ORG_KEY -u STRIPE_ACCOUNTS -u MCP_TOKEN fnox ${profile:+-P "$profile"} exec -- jq -n '
  $ENV | {STRIPE_ORG_KEY, STRIPE_ACCOUNTS, MCP_TOKEN}
  | if any(.[]; . == null or . == "") then error("empty in the fnox profile: \([to_entries[] | select(.value == null or .value == "") | .key] | join(", "))") else . end
  | .STRIPE_ACCOUNTS |= (fromjson | tojson)
')"
# fnox supplies the Cloudflare API token; the Stripe secrets reach wrangler only on stdin.
printf %s "$secrets" | fnox ${profile:+-P "$profile"} exec -- env -u STRIPE_ORG_KEY -u STRIPE_ACCOUNTS -u MCP_TOKEN wrangler secret bulk
'''

# Skip native test and vet while every package is wasm-only.
[tasks.test]
description = "Run Go tests with the race detector"
run = """
pkgs="$(go list ./...)"
if [ -z "$pkgs" ]; then echo 'test: no native packages yet'; exit 0; fi
go test -race $pkgs
"""

[tasks.lint]
description = "Vet the native and wasm builds"
run = """
pkgs="$(go list ./...)"
if [ -n "$pkgs" ]; then go vet $pkgs; else echo 'lint: no native packages yet'; fi
GOOS=js GOARCH=wasm go vet ./...
"""

[tasks.check]
description = "Check formatting and that the worker compiles to wasm"
run = """
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/mcp-worker
"""

[tasks.probe]
description = "Probe the Stripe org key's permissions without changing anything"
usage = '''
flag "-P --profile <profile>" help="fnox profile to load STRIPE_ORG_KEY from"
arg "[account]" help="acct_ ID to send as Stripe-Context (default: $STRIPE_TEST_ACCOUNT)"
'''
run = """
if [ -n "${usage_profile:-}" ]; then
  # Drop any inherited key so a failed lookup can't fall back to another profile's key.
  exec env -u STRIPE_ORG_KEY fnox -P "$usage_profile" exec -- scripts/probe-permissions.sh ${usage_account:+"$usage_account"}
elif [ -n "${STRIPE_ORG_KEY:-}" ]; then
  exec scripts/probe-permissions.sh ${usage_account:+"$usage_account"}
else
  exec fnox exec -- scripts/probe-permissions.sh ${usage_account:+"$usage_account"}
fi
"""
